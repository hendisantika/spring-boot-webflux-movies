version: 2
updates:
  # Maven dependencies for every micro service
  - package-ecosystem: maven
    directories:
      - "/movies-info-service"
      - "/movies-review-service"
      - "/movies-service"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    target-branch: main
    labels:
      - dependencies
      - java
    assignees:
      - hendisantika
    commit-message:
      prefix: "chore"
      include: scope
    rebase-strategy: auto
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
      testcontainers:
        patterns:
          - "org.testcontainers*"
      test-libraries:
        patterns:
          - "org.wiremock*"
          - "io.projectreactor*"
          - "org.junit*"
          - "org.mockito*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins*"
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github_actions
    assignees:
      - hendisantika
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  # MongoDB image used by docker-compose.yml
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    assignees:
      - hendisantika
    commit-message:
      prefix: "chore"
      include: scope
